name: Daily Auto SEO Blog Publisher

on:
  schedule:
    # 매일 오전 8시 (한국 시간 KST = UTC+9 -> 23:00 UTC) 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHub 웹페이지에서 버튼 클릭 한 번으로 즉시 수동 실행도 가능

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Auto Poster Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot/auto_poster.py

      - name: Commit and Push new post
        run: |
          git config user.name "Auto Income Bot"
          git config user.email "bot@smart-calc-hub.pages.dev"
          git add src/content/blog/ bot/history.json
          if git diff --staged --quiet; then
            echo "새로 추가된 글이 없습니다."
          else
            git commit -m "chore(blog): auto-publish daily SEO post"
            git push
          fi
